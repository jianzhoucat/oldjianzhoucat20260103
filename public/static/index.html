<!DOCTYPE html>

    <link rel="stylesheet" href="assets/css/style.css">

<body>
    <!-- Header 导航栏 -->
    <header class="header" id="header">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <a href="#home">我的网站</a>
                </div>
                <nav class="nav" id="nav">
                    <ul class="nav-list">
                        <li><a href="#home" class="nav-link">首页</a></li>
                        <li><a href="#about" class="nav-link">关于</a></li>
                        <li><a href="contact.html" class="nav-link">联系</a></li>

                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero 区域 -->
    <section class="hero" id="home">
        <div class="hero-background"></div>
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">欢迎来到我的世界</h1>
                <p class="hero-subtitle">探索创意、技术与设计的完美融合</p>
                <div class="hero-buttons">
                    <a href="#about" class="btn btn-primary">了解更多</a>
                    <a href="contact.html" class="btn btn-secondary">联系我</a>
                </div>
            </div>
            <div class="hero-image">
                <div class="image-placeholder">
                    <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="400" height="300" fill="url(#gradient)"/>
                        <circle cx="100" cy="100" r="60" fill="rgba(255,255,255,0.1)"/>
                        <circle cx="300" cy="200" r="80" fill="rgba(255,255,255,0.1)"/>
                        <path d="M50 250 Q200 150 350 250" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="400" y2="300">
                                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
        </div>

                <div class="about-card">
                    <div class="card-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>

                    <h3>创新设计</h3>
                    <p>我们追求独特而富有创意的设计理念，为每个项目注入新鲜活力，打造令人难忘的视觉体验。</p>
                </div>
                <div class="about-card">
                    <div class="card-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>
                    </div>
                    <h3>响应式开发</h3>
                    <p>采用最新的前端技术，确保网站在各种设备上都能完美呈现，提供流畅的用户体验。</p>
                </div>
                <div class="about-card">
                    <div class="card-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <h3>快速交付</h3>
                    <p>高效的工作流程和专业的团队协作，确保项目按时高质量完成，超越客户期望。</p>
                </div>
            </div>
        </div>
